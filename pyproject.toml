[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drawing-aide"
version = "0.1.0"
description = "Turn photos into paintings: block impasto, minimalist, cubist and pointillist styles, with paint-by-number sheets."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.22", "Pillow>=9.0"]

[project.optional-dependencies]
subject = ["onnxruntime>=1.15"]
test = ["pytest>=7"]

[project.scripts]
drawing-aide = "drawing_aide.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
