name: android

# Builds the Android app on every push. Pushes to the default branch are signed with the
# release key from repository secrets and published as a GitHub Release, which installed
# copies of the app pick up as an update.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      IS_DEFAULT: ${{ github.ref_name == github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Load signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [ "$IS_DEFAULT" = "true" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets (see android/README.md) so releases are signed with the same key every time."
            exit 1
          else
            echo "::warning::No signing secrets; building a test APK with a throwaway debug key."
          fi

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/drawing-aide-0.1.${VERSION_CODE}.apk"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: drawing-aide-apk
          path: dist/*.apk

      - name: Publish release
        if: env.IS_DEFAULT == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --format='%s' > notes.txt
          gh release create "android-v${VERSION_CODE}" dist/*.apk \
            --title "Drawing Aide 0.1.${VERSION_CODE}" \
            --notes-file notes.txt \
            --target "$GITHUB_SHA" \
            --latest
