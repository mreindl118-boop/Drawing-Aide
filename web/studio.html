<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drawing Aide Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: photo-editor. The painting fills a fixed-height viewport; every control sits in one dock
   directly beneath it (on wide screens, directly beside it). Nothing above the image moves. */
:root{
  --bg:#111215; --panel:#1a1c20; --raise:#24272c; --ink:#eceef1; --muted:#949ba5; --line:#2e3238;
  --accent:#ec8fb0; --accent-ink:#2a0f1a; --well:#0b0c0e;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--body);
  padding-left:max(0px, env(safe-area-inset-left, 0px));padding-right:max(0px, env(safe-area-inset-right, 0px));padding-block:0}
.app{max-width:1280px;margin:0 auto;display:grid;grid-template-rows:auto auto 1fr;min-height:100%}
.bar{display:flex;align-items:center;gap:10px;padding:10px max(16px, env(safe-area-inset-left, 0px)) 10px max(16px, env(safe-area-inset-right, 0px));
  position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.brand{font:700 18px/1 var(--display);letter-spacing:-.01em;margin-right:auto}
.brand span{color:var(--accent)}
.btn{font:600 14px/1 var(--body);color:var(--ink);background:var(--raise);border:1px solid var(--line);border-radius:999px;padding:10px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;min-height:40px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:focus-visible,.chip:focus-visible,.sty:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn svg{width:18px;height:18px}
.main{display:grid;grid-template-columns:minmax(0,1fr);gap:0;align-content:start}
@media (min-width:980px){.main{grid-template-columns:minmax(0,1fr) 400px;gap:16px;padding:0 16px 16px}}
.view{position:relative;background:var(--well);height:min(62vh,760px);display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:manipulation;user-select:none}
@media (min-width:980px){.view{height:calc(100vh - 80px);border-radius:14px}}
.view img{max-width:calc(100% - 24px);max-height:calc(100% - 24px);object-fit:contain;display:block;box-shadow:0 10px 30px -8px rgba(0,0,0,.6);transition:opacity .15s}
.view img.orig{position:absolute}
.view.busy #out{opacity:.72}
.spin{position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:50%;border:3px solid rgba(255,255,255,.18);border-top-color:var(--accent);animation:sp .8s linear infinite;display:none}
.view.busy .spin{display:block}
@keyframes sp{to{transform:rotate(360deg)}}
.hint{position:absolute;left:12px;bottom:10px;font:500 11.5px var(--mono);color:#cfd3d9;background:rgba(0,0,0,.45);padding:4px 8px;border-radius:999px;pointer-events:none}
.dock{background:var(--panel);padding:14px max(16px, env(safe-area-inset-left, 0px)) 24px max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:14px;min-width:0}
@media (min-width:980px){.dock{border-radius:14px;max-height:calc(100vh - 80px);overflow:auto}}
.srow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px}
.srow label{font:600 12px var(--body);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.val{font:500 13px var(--mono);font-variant-numeric:tabular-nums;min-width:58px;text-align:right}
input[type=range]{width:100%;accent-color:var(--accent);height:28px;margin:0}
.strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:4px;margin:0 -4px;padding-left:4px;scrollbar-width:thin}
.sty{all:unset;cursor:pointer;flex:none;width:84px;scroll-snap-align:start;display:flex;flex-direction:column;gap:6px;align-items:center}
.sty canvas{width:84px;height:84px;border-radius:12px;background:var(--raise);display:block;border:2px solid transparent}
.sty[aria-pressed="true"] canvas{border-color:var(--accent)}
.sty b{font:500 12px/1.2 var(--body);color:var(--muted);text-align:center}
.sty[aria-pressed="true"] b{color:var(--ink);font-weight:600}
@media (min-width:980px){.strip{flex-wrap:wrap;overflow:visible}.sty{width:calc((100% - 30px)/4)}.sty canvas{width:100%;height:auto;aspect-ratio:1}}
.opts{display:flex;flex-wrap:wrap;gap:8px;min-height:36px;align-items:center}
.chip{all:unset;cursor:pointer;font:500 13px var(--body);border:1px solid var(--line);border-radius:999px;padding:7px 12px;background:var(--raise);display:inline-flex;align-items:center;gap:7px}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.chip i{width:14px;height:14px;border-radius:50%;display:inline-block;border:1px solid rgba(255,255,255,.25)}
.sep{width:1px;height:22px;background:var(--line)}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font:600 12px var(--body);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;list-style:none;display:flex;justify-content:space-between}
summary::after{content:"+";font:500 16px var(--mono)}
details[open] summary::after{content:"–"}
.grid3{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.field{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted);min-width:0}
.field input,.field select{font:500 14px var(--mono);color:var(--ink);background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:6px;margin-top:10px}
.sw{display:flex;align-items:center;gap:7px;font:11.5px var(--mono);font-variant-numeric:tabular-nums;min-width:0}
.sw i{width:24px;height:24px;border-radius:4px;flex:none;border:1px solid rgba(255,255,255,.15)}
.sw span{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.sw em{font-style:normal;color:var(--muted);font-size:10.5px}
.meta{font:12px var(--mono);color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.meta b{color:var(--ink);font-weight:500}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font:12px var(--mono);color:var(--muted)}
.linkbtn{all:unset;cursor:pointer;color:var(--accent);font:500 12px var(--body)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font:500 13px var(--body);padding:9px 14px;border-radius:999px;z-index:20}
.note{margin:8px 0 0;font:12px var(--body);color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <header class="bar">
    <div class="brand">Drawing <span>Aide</span></div>
    <label class="btn" for="file" id="pickBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="m21 16-5-5-9 8"/></svg>Photo</label>
    <input type="file" id="file" accept="image/*" hidden>
    <button type="button" class="btn primary" id="save"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg>Save</button>
  </header>

  <div class="main">
    <div class="view" id="view">
      <img id="out" alt="Your painting">
      <img id="orig" class="orig" alt="Original photo" hidden>
      <div class="spin" aria-hidden="true"></div>
      <span class="hint" id="hint">Hold to compare</span>
    </div>

    <section class="dock" aria-label="Controls">
      <div class="srow">
        <label for="size" id="sizeLbl">Block size</label>
        <input type="range" id="size" min="0" max="1000" value="500">
        <span class="val" id="sizeVal"></span>
      </div>

      <div class="strip" id="styles" role="group" aria-label="Style"></div>

      <div class="opts" id="opts"></div>

      <div class="meta" id="meta"></div>

      <details id="palSec">
        <summary>Palette</summary>
        <div class="palette" id="palette"></div>
      </details>

      <details>
        <summary>Canvas</summary>
        <div class="grid3">
          <label class="field">Width cm<input id="cw" type="number" inputmode="numeric" min="20" max="400" value="100"></label>
          <label class="field">Height cm<input id="ch" type="number" inputmode="numeric" min="20" max="400" value="120"></label>
          <label class="field">Colours<input id="ncol" type="number" inputmode="numeric" min="3" max="40" value="24"></label>
          <label class="field">Ratio<select id="ratio"></select></label>
        </div>
        <p class="note" id="lockNote"></p>
      </details>

      <div class="foot"><span id="srcName">Sample: NASA portrait (public domain)</span><span><span id="appver"></span> <button type="button" class="linkbtn" id="upd" hidden>Check for updates</button></span></div>
    </section>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script type="text/plain" id="engine-src">

/* ---------------- utilities ---------------- */
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gauss(r){let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(6.2831853*v)}
const lin=c=>{c/=255;return c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4)};
const LIN=new Float32Array(256);for(let i=0;i<256;i++)LIN[i]=lin(i);
function rgb2lab(r,g,b){r=LIN[r|0];g=LIN[g|0];b=LIN[b|0];
  let x=(r*0.4124+g*0.3576+b*0.1805)/0.95047,y=r*0.2126+g*0.7152+b*0.0722,z=(r*0.0193+g*0.1192+b*0.9505)/1.08883;
  const f=t=>t>0.008856?Math.cbrt(t):7.787*t+16/116;x=f(x);y=f(y);z=f(z);return[116*y-16,500*(x-y),200*(y-z)]}
function lab2rgb(L,a,b){let fy=(L+16)/116,fx=fy+a/500,fz=fy-b/200;
  const fi=t=>t*t*t>0.008856?t*t*t:(t-16/116)/7.787;let x=fi(fx)*0.95047,y=fi(fy),z=fi(fz)*1.08883;
  let r=3.2406*x-1.5372*y-0.4986*z,g=-0.9689*x+1.8758*y+0.0415*z,bb=0.0557*x-0.2040*y+1.0570*z;
  const gm=c=>{c=Math.min(1,Math.max(0,c));return 255*(c<=0.0031308?12.92*c:1.055*Math.pow(c,1/2.4)-0.055)};return[gm(r),gm(g),gm(bb)]}
const hex=c=>"#"+c.map(v=>Math.round(v).toString(16).padStart(2,"0")).join("");
function isSkin(L,a,b){const h=Math.atan2(b,a)*57.3,C=Math.hypot(a,b);return h>20&&h<75&&C>8&&C<55&&L>25}
function painterly(lab,desat,warm){const[L,a,b]=lab;const s=isSkin(L,a,b);const k=s?1:desat;return[6+L*0.92,a*k,b*k+(s?0:warm)]}
function kmeans(X,k,r,iters=30){const n=X.length;k=Math.min(k,n);const C=[X[Math.floor(r()*n)].slice()];
  const d=new Float64Array(n);
  while(C.length<k){let s=0;for(let i=0;i<n;i++){let m=1e18;for(const c of C){const e=(X[i][0]-c[0])**2+(X[i][1]-c[1])**2+(X[i][2]-c[2])**2;if(e<m)m=e}d[i]=m;s+=m}
    if(s===0)break;let t=r()*s,i=0;for(;i<n-1;i++){t-=d[i];if(t<=0)break}C.push(X[i].slice())}
  const lb=new Int32Array(n);
  for(let it=0;it<iters;it++){const S=C.map(()=>[0,0,0,0]);
    for(let i=0;i<n;i++){let m=1e18,j=0;for(let q=0;q<C.length;q++){const c=C[q];const e=(X[i][0]-c[0])**2+(X[i][1]-c[1])**2+(X[i][2]-c[2])**2;if(e<m){m=e;j=q}}lb[i]=j;const s=S[j];s[0]+=X[i][0];s[1]+=X[i][1];s[2]+=X[i][2];s[3]++}
    let moved=0;for(let q=0;q<C.length;q++){if(!S[q][3])continue;const nc=[S[q][0]/S[q][3],S[q][1]/S[q][3],S[q][2]/S[q][3]];moved+=Math.abs(nc[0]-C[q][0])+Math.abs(nc[1]-C[q][1]);C[q]=nc}
    if(moved<0.05)break}
  return{C,lb}}
function noise1d(n,sp,r){const m=Math.ceil(n/sp)+3,p=new Float32Array(m);for(let i=0;i<m;i++)p[i]=gauss(r);
  const o=new Float32Array(n);for(let i=0;i<n;i++){const x=i/sp,j=Math.floor(x);let t=x-j;t=t*t*(3-2*t);o[i]=p[j]*(1-t)+p[j+1]*t}return o}
function boxBlur(a,w,h,r,passes=3){r=Math.max(1,Math.round(r));let s=a,t=new Float32Array(w*h);const d=2*r+1;
  for(let p=0;p<passes;p++){
    for(let y=0;y<h;y++){let acc=0;const o=y*w;for(let x=-r-1;x<r;x++)acc+=s[o+Math.min(w-1,Math.max(0,x))];
      for(let x=0;x<w;x++){acc+=s[o+Math.min(w-1,x+r)]-s[o+Math.max(0,x-r-1)];t[o+x]=acc/d}}
    const u=new Float32Array(w*h);
    for(let x=0;x<w;x++){let acc=0;for(let y=-r-1;y<r;y++)acc+=t[Math.min(h-1,Math.max(0,y))*w+x];
      for(let y=0;y<h;y++){acc+=t[Math.min(h-1,y+r)*w+x]-t[Math.max(0,y-r-1)*w+x];u[y*w+x]=acc/d}}
    s=u}
  return s}
const ss=(e0,e1,x)=>{let t=(x-e0)/(e1-e0);t=t<0?0:t>1?1:t;return t*t*(3-2*t)};
function sampleImage(img,w,h){const c=new OffscreenCanvas(1,1);c.width=w;c.height=h;const g=c.getContext("2d",{willReadFrequently:true});g.imageSmoothingQuality="high";g.drawImage(img,0,0,w,h);return g.getImageData(0,0,w,h).data}
function cropCanvas(img,aspect){const w=img.width,h=img.height;let sx=0,sy=0,sw=w,sh=h;
  if(w/h>aspect){sw=h*aspect;sx=(w-sw)/2}else{sh=w/aspect;sy=(h-sh)/2}
  const c=new OffscreenCanvas(1,1);const sc=Math.min(1,1400/Math.max(sw,sh));c.width=Math.round(sw*sc);c.height=Math.round(sh*sc);
  c.getContext("2d",{willReadFrequently:true}).drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);return c}
function hexToRgb(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]}
function paletteFrom(labs,k,r,desat=0.9,warm=1.5){const X=labs.map(l=>painterly(l,desat,warm));const{C,lb}=kmeans(X,k,r);
  const ord=C.map((c,i)=>i).sort((a,b)=>C[a][0]-C[b][0]);const re=new Int32Array(C.length);ord.forEach((o,i)=>re[o]=i);
  return{C:ord.map(i=>C[i]),lb:Array.from(lb,x=>re[x])}}

/* ---------------- styles ---------------- */

function canvasDims(img,cfg){let W=cfg.cw,H=cfg.ch;if(cfg.orient==="auto"&&((img.width>img.height)!==(W>H))){[W,H]=[H,W]}return[W,H]}

function renderBlocks(img,cfg){
  const r=rng(7);const[Wcm,Hcm]=canvasDims(img,cfg);const pitch=2.54*cfg.size;
  const cols=Math.max(2,Math.floor(Wcm/pitch)),rows=Math.max(2,Math.floor(Hcm/pitch));
  const src=cropCanvas(img,cols/rows);const K=6;const px=sampleImage(src,cols*K,rows*K);
  const labs=[];
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const L=[];for(let j=0;j<K;j++)for(let i=0;i<K;i++){const o=((y*K+j)*cols*K+x*K+i)*4;L.push(rgb2lab(px[o],px[o+1],px[o+2]))}
    const med=[0,1,2].map(c=>L.map(l=>l[c]).sort((a,b)=>a-b)[L.length>>1]);
    const ds=L.map(l=>Math.hypot(l[0]-med[0],l[1]-med[1],l[2]-med[2]));const th=ds.slice().sort((a,b)=>a-b)[Math.floor(L.length*0.6)];
    let s=[0,0,0],n=0;L.forEach((l,i)=>{if(ds[i]<=th){s[0]+=l[0];s[1]+=l[1];s[2]+=l[2];n++}});labs.push(s.map(v=>v/n))}
  // optional: skip cells close to the dominant border colour (plain backgrounds)
  let painted=labs.map(()=>true);
  if(cfg.subjectOnly){const border=[];for(let y=0;y<rows;y++)for(let x=0;x<cols;x++)if(!x||!y||x===cols-1||y===rows-1)border.push(labs[y*cols+x]);
    const bm=[0,1,2].map(c=>border.map(l=>l[c]).sort((a,b)=>a-b)[border.length>>1]);
    painted=labs.map(l=>Math.hypot(l[0]-bm[0],(l[1]-bm[1])*1.5,(l[2]-bm[2])*1.5)>11);
    // flood from edges so only background connected to the border is skipped
    const keep=new Uint8Array(cols*rows),q=[];for(let i=0;i<labs.length;i++){const x=i%cols,y=(i/cols)|0;if((!x||!y||x===cols-1||y===rows-1)&&!painted[i]){keep[i]=1;q.push(i)}}
    while(q.length){const i=q.pop(),x=i%cols,y=(i/cols)|0;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=cols||ny>=rows)continue;const j=ny*cols+nx;if(!keep[j]&&!painted[j]){keep[j]=1;q.push(j)}}}
    painted=labs.map((l,i)=>!keep[i])}
  const idxs=[];labs.forEach((l,i)=>{if(painted[i])idxs.push(i)});
  const{C,lb}=paletteFrom(idxs.map(i=>labs[i]),cfg.ncol,r);
  const idx=new Int32Array(cols*rows).fill(-1);idxs.forEach((c,i)=>idx[c]=lb[i]);
  const pal=C.map(c=>lab2rgb(...c));
  if(cfg.pbn)return drawPBN(idx,pal,cols,rows,Wcm,Hcm);

  const P=Math.max(14,Math.min(56,Math.floor((cfg.maxPx||1500)/Math.max(cols,rows*0.85))));
  const Wp=Math.round(Wcm/pitch*P),Hp=Math.round(Hcm/pitch*P),ox=((Wp-cols*P)/2)|0,oy=((Hp-rows*P)/2)|0;
  const N=Wp*Hp,Hm=new Float32Array(N),A=new Float32Array(N),R=new Float32Array(N),G=new Float32Array(N),B=new Float32Array(N);
  const gap=0.11*P,g2=gap/2,wob=Math.max(1,P*0.025);
  const h=new Float32Array(P*P),tint=new Float32Array(P*P),al=new Float32Array(P*P),dd=new Float32Array(P*P);
  for(let by=0;by<rows;by++)for(let bx=0;bx<cols;bx++){const id=idx[by*cols+bx];if(id<0)continue;
    // ragged edges
    const nl=noise1d(P,P/4,r),nr=noise1d(P,P/4,r),nt=noise1d(P,P/4,r),nb=noise1d(P,P/4,r);
    const el=gauss(r)*wob*0.6,er=gauss(r)*wob*0.6,et=gauss(r)*wob*0.6,eb=gauss(r)*wob*0.6;
    const n2=noise1d(P*P,P/3,r);
    for(let y=0;y<P;y++)for(let x=0;x<P;x++){const l=g2+wob*0.8*nl[y]+el,rr=P-g2+wob*0.8*nr[y]+er,t=g2+wob*0.8*nt[x]+et,b=P-g2+wob*0.8*nb[x]+eb;
      const dx=Math.min(x-l,rr-x),dy=Math.min(y-t,b-y);const d=(dx>0&&dy>0)?Math.min(dx,dy):-Math.hypot(Math.max(-dx,0),Math.max(-dy,0));
      const k=y*P+x;dd[k]=d;al[k]=Math.min(1,Math.max(0,d+0.5));h[k]=0.45+0.06*n2[k];tint[k]=0}
    const base=[0,0,0,90,90,45,-30][Math.floor(r()*7)];const ns=2+Math.floor(r()*3);const c=P/2;
    for(let s=0;s<ns;s++){const th=(base+gauss(r)*10+(r()<0.5?180:0))*Math.PI/180,ct=Math.cos(th),st=Math.sin(th);

function renderInk(img,cfg){const r=rng(17);const[W,H,Wcm,Hcm]=outSize(img,cfg);const src=cropCanvas(img,W/H);const px=sampleImage(src,W,H);

      const g=base-sse(a)-sse(b);if(!best||g>best.g)best={g,nd,a,b}}

  const nodes=[],open=[];const leaf=idx=>{const id=nodes.length;nodes.push({leaf:true,idx});open.push(id);return id};
  leaf(Array.from({length:N},(_,i)=>i));const cache=new Map();let count=1;
  while(count<leaves){let bi=-1,bg=-1;for(let k=0;k<open.length;k++){const id=open[k];if(!cache.has(id))cache.set(id,bestSplit(nodes[id].idx));const s=cache.get(id);if(s&&s.g>bg){bg=s.g;bi=k}}
    if(bi<0)break;const id=open[bi],s=cache.get(id);open.splice(bi,1);cache.delete(id);
    const A=leaf(s.a),B=leaf(s.b);nodes[id]={leaf:false,nd:s.nd,A,B};count++}
  // leaf ids and per-leaf mean colour (from the small copy)
  const leafOf=new Map();let nl=0;for(let i=0;i<nodes.length;i++)if(nodes[i].leaf)leafOf.set(i,nl++);
  const mean=[];for(let i=0;i<nodes.length;i++)if(nodes[i].leaf){let sl=0,sa=0,sb=0;const idx=nodes[i].idx;for(const j of idx){sl+=LL[j];sa+=AA[j];sb+=BB[j]}const n=Math.max(1,idx.length);mean[leafOf.get(i)]=[sl/n,sa/n/opt.chromaW,sb/n/opt.chromaW,idx.length]}
  // full-size lookup
  const own=new Int32Array(W*H);
  for(let y=0;y<H;y++){const fy=(y+0.5)/H;for(let x=0;x<W;x++){const fx=(x+0.5)/W;let id=0,nd;
    while(!(nd=nodes[id]).leaf){const q=nd.nd;const inA=q.t==="c"?((fx-q.cx)*asp)**2+(fy-q.cy)**2<q.r*q.r:fx*q.nx+fy*q.ny>q.c;id=inA?nd.A:nd.B}
    own[y*W+x]=leafOf.get(id)}}
  return{own,mean,n:nl}}
function facetEdges(own,W,H,lw){const e=new Float32Array(W*H);for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x,s=own[i];
  if((x+1<W&&own[i+1]!==s)||(y+1<H&&own[i+W]!==s))e[i]=1}
  if(lw<=1)return e;const b=boxBlur(e,W,H,lw/2,1);for(let i=0;i<e.length;i++)b[i]=ss(0.1,0.3,b[i]);return b}

/* Geometric: minimal flat colour shapes (straight cuts and a few circles), bold limited palette, clean ink lines. */
function renderGeometric(img,cfg){const r=rng(53);const[W,H,Wcm,Hcm]=outSize(img,cfg);const src=cropCanvas(img,W/H);
  const leaves=Math.round(14+(10-cfg.size)**1.6*4.5);
  const{own,mean,n}=facetTree(src,W,H,leaves,r,{tries:28,circleP:0.12,angles:[0,Math.PI/4,Math.PI/2,3*Math.PI/4],jitter:0.12,chromaW:1.3,minFrac:0.12,detail:1.5});
  const k=Math.max(4,Math.min(8,Math.round(cfg.ncol/4)));const{C,lb}=paletteFrom(mean.map(m=>[m[0],m[1],m[2]]),Math.min(k,n),r,1,0);
  // flat, poster-like colours: push chroma up and spread the values apart
  const pal=C.map(([L,a,b])=>lab2rgb(Math.max(14,Math.min(95,(L-50)*1.15+52)),a*1.5,b*1.5));
  const lw=Math.max(1.5,W/320),E=facetEdges(own,W,H,lw),ink=[30,30,34];
  const out=new ImageData(W,H),d=out.data;
  for(let i=0;i<W*H;i++){const p=pal[lb[own[i]]],e=E[i];d[i*4]=p[0]+(ink[0]-p[0])*e;d[i*4+1]=p[1]+(ink[1]-p[1])*e;d[i*4+2]=p[2]+(ink[2]-p[2])*e;d[i*4+3]=255}
  paperTexture(d,W,H,r,0.25);
  return{data:out,pal,counts:pal.map((_,q)=>lb.reduce((s,v)=>s+(v===q),0)),countUnit:"shapes",info:{Canvas:`${Wcm} × ${Hcm} cm`,Shapes:n}}}

/* Cubist (analytic): the subject broken into angular planes, each shaded light-to-dark across its face,
   in an earthy ochre / umber / slate palette, with charcoal contour lines that come and go. */
const CUBIST_PAL=[[44,40,38],[86,70,56],[124,92,62],[164,120,72],[198,160,98],[222,204,164],[96,104,106],[128,132,118],[152,112,92],[70,82,92]];
function renderCubist(img,cfg){const r=rng(5);const[W,H,Wcm,Hcm]=outSize(img,cfg);const src=cropCanvas(img,W/H);
  const leaves=Math.round(70+(10-cfg.size)**1.5*12);
  const{own,mean,n}=facetTree(src,W,H,leaves,r,{tries:22,circleP:0.04,angles:null,jitter:0,chromaW:0.7,minFrac:0.06,detail:2.5});
  const PL=CUBIST_PAL.map(c=>rgb2lab(c[0],c[1],c[2]));
  // each plane: nearest earthy colour by value first, hue second; a random light direction; how strongly it is shaded
  const fac=mean.map(([L,a,b])=>{let bi=0,bd=1e9;for(let q=0;q<PL.length;q++){const p=PL[q];const dd=(p[0]-L)**2*1+((p[1]-a*0.6)**2+(p[2]-b*0.6)**2)*0.35;if(dd<bd){bd=dd;bi=q}}
    const ang=r()*Math.PI*2;const bp=PL[bi];return{base:[bp[0],bp[1]*0.5+a*0.6,bp[2]*0.5+b*0.6],L,dx:Math.cos(ang),dy:Math.sin(ang),amp:5+r()*8}});
  // plane extents along their shading direction
  const lo=new Float32Array(n).fill(1e9),hi=new Float32Array(n).fill(-1e9);
  for(let y=0;y<H;y+=2)for(let x=0;x<W;x+=2){const f=fac[own[y*W+x]],s=own[y*W+x],p=x*f.dx+y*f.dy;if(p<lo[s])lo[s]=p;if(p>hi[s])hi[s]=p}
  const lw=Math.max(1.5,W/380),E=facetEdges(own,W,H,lw);
  // contour lines fade in and out along their length, like charcoal
  const flick=lowNoise(W,H,Math.max(8,W/25),r),grain=lowNoise(W,H,2.5,r);
  const out=new ImageData(W,H),d=out.data;const pal=fac.map(f=>lab2rgb(f.base[0],f.base[1],f.base[2]));
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x,s=own[i],f=fac[s];const t=hi[s]>lo[s]?((x*f.dx+y*f.dy)-lo[s])/(hi[s]-lo[s]):0.5;
    const Lv=f.base[0]*0.2+f.L*0.8+(t-0.5)*f.amp*2+grain[i]*3;
    let[R,G,B]=lab2rgb(Math.max(8,Math.min(96,Lv)),f.base[1],f.base[2]);
    const e=E[i]*ss(-0.4,0.2,flick[i])*0.9;R+=(34-R)*e;G+=(30-G)*e;B+=(28-B)*e;
    d[i*4]=R;d[i*4+1]=G;d[i*4+2]=B;d[i*4+3]=255}
  paperTexture(d,W,H,r,0.45);
  return{data:out,pal:null,info:{Canvas:`${Wcm} × ${Hcm} cm`,Planes:n}}}

const RENDER={blocks:renderBlocks,impressionist:renderImpressionist,vangogh:renderVanGogh,watercolor:renderWatercolor,ink:renderInk,pencil:renderPencil,
  cartoon:renderCartoon,anime:renderAnime,poster:renderPoster,pop:renderPop,geometric:renderGeometric,cubist:renderCubist,glass:renderGlass,lowpoly:renderLowPoly,
  minimal:renderMinimal,pointillist:renderPointillist};

/* ---------------- worker entry ---------------- */
self.onmessage=e=>{const{id,style,cfg,bitmap}=e.data;
  try{const res=RENDER[style](bitmap,cfg);const im=res.data;
    self.postMessage({id,ok:true,w:im.width,h:im.height,buf:im.data.buffer,pal:res.pal,counts:res.counts||null,countUnit:res.countUnit||"blocks",info:res.info,grid:res.grid||null},[im.data.buffer])}
  catch(err){self.postMessage({id,ok:false,error:String(err&&err.message||err)})}};
</script>

const META=Object.fromEntries(STYLES);
const GROUNDS=[["#efbcc8","Pink"],["#f1f0ec","White"],["#2a2a2a","Charcoal"]];
const RATIOS=[["photo","Match photo"],["5:6","5 : 6"],["4:5","4 : 5"],["3:4","3 : 4"],["2:3","2 : 3"],["1:1","1 : 1"],["16:9","16 : 9"],["free","Free"]];

/* ---------------- render workers ---------------- */
const ENGINE_URL=URL.createObjectURL(new Blob([document.getElementById("engine-src").textContent],{type:"text/javascript"}));
// crash guard: remember which style is painting; if the app dies mid-paint, the next launch skips it
function crashMark(who,style){try{style?localStorage.setItem("da-pending-"+who,style):localStorage.removeItem("da-pending-"+who)}catch(e){}}
const crashed=new Set();for(const who of["preview","thumb","save"]){try{const s=localStorage.getItem("da-pending-"+who);if(s)crashed.add(s);localStorage.removeItem("da-pending-"+who)}catch(e){}}
class Renderer{constructor(who){this.who=who;this.w=null;this.job=0;this.pending=null}
  cancel(){if(this.pending){this.w.terminate();this.w=null;crashMark(this.who,null);const p=this.pending;this.pending=null;p.reject({cancelled:true})}}
  run(style,cfg,bitmap){ // a new request cancels whatever is still running
    if(this.pending){this.w.terminate();this.w=null;this.pending.reject({cancelled:true});this.pending=null}
    if(!this.w)this.w=new Worker(ENGINE_URL);
    const id=++this.job;crashMark(this.who,style);
    return new Promise((resolve,reject)=>{this.pending={resolve,reject};
      this.w.onmessage=e=>{if(e.data.id!==id)return;this.pending=null;crashMark(this.who,null);e.data.ok?resolve(e.data):reject(e.data)};
      this.w.onerror=e=>{this.pending=null;crashMark(this.who,null);reject({error:e.message||"render failed"})};
      this.w.postMessage({id,style,cfg,bitmap})})}}
const preview=new Renderer("preview"),thumbR=new Renderer("thumb"),saver=new Renderer("save");

/* ---------------- state ---------------- */
const $=id=>document.getElementById(id);
const hex=c=>"#"+c.map(v=>Math.round(v).toString(16).padStart(2,"0")).join("");
const state={style:"blocks",sizes:{},ground:{},skipbg:false,pbn:false,ratio:"5:6",cw:100,ch:120,ncol:24,bitmap:null,photoW:1,photoH:1,srcName:"painting",origURL:null,lastCanvas:null};
for(const[k,m]of STYLES){state.sizes[k]=m.size.def;if(m.ground)state.ground[k]=m.ground}
try{const s=JSON.parse(localStorage.getItem("da-studio")||"{}");if(s.style&&META[s.style])state.style=s.style;
  if(s.sizes)for(const k in s.sizes)if(META[k])state.sizes[k]=s.sizes[k];if(s.ground)Object.assign(state.ground,s.ground);
  if(s.ratio)state.ratio=s.ratio;if(s.cw)state.cw=s.cw;if(s.ch)state.ch=s.ch;if(s.ncol)state.ncol=s.ncol}catch(e){}
if(crashed.has(state.style))state.style="blocks";
function persist(){try{localStorage.setItem("da-studio",JSON.stringify({style:state.style,sizes:state.sizes,ground:state.ground,ratio:state.ratio,cw:state.cw,ch:state.ch,ncol:state.ncol}))}catch(e){}}

function toast(msg){const t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}

/* ---------------- canvas size with ratio lock ---------------- */
function ratioWH(){if(state.ratio==="photo")return state.photoW/state.photoH;if(state.ratio==="free")return null;
  const[a,b]=state.ratio.split(":").map(Number);let q=a/b;const photoLand=state.photoW>state.photoH;if((q>1)!==photoLand&&q!==1)q=1/q;return q}
function applyRatio(changed){const q=ratioWH();if(!q)return;
  if(changed==="ch")state.cw=Math.round(state.ch*q*10)/10;else state.ch=Math.round(state.cw/q*10)/10;}
function cfgFor(style,maxPx){return{size:state.sizes[style],cw:state.cw,ch:state.ch,ncol:state.ncol,orient:"fixed",ground:state.ground[style]||"#efbcc8",
  subjectOnly:state.skipbg,pbn:style==="blocks"&&state.pbn,jit:1,maxPx}}

/* ---------------- UI build ---------------- */
const stylesEl=$("styles");
for(const[k,m]of STYLES){const b=document.createElement("button");b.type="button";b.className="sty";b.dataset.k=k;
  b.innerHTML=`<canvas width="168" height="168"></canvas><b>${m.name}</b>`;b.onclick=()=>{if(state.style===k)return;state.style=k;syncControls();go(0)};stylesEl.appendChild(b)}
const ratioSel=$("ratio");for(const[v,l]of RATIOS){const o=document.createElement("option");o.value=v;o.textContent=l;ratioSel.appendChild(o)}

function sliderToVal(){const s=META[state.style].size;const t=+$("size").value/1000;return Math.round((s.min+t*(s.max-s.min))/s.step)*s.step}
function valToSlider(v){const s=META[state.style].size;return Math.round((v-s.min)/(s.max-s.min)*1000)}

function buildOpts(){const m=META[state.style],o=$("opts");o.innerHTML="";const opts=m.opts||[];
  if(!opts.length){const p=document.createElement("span");p.className="note";p.textContent=m.note;o.appendChild(p);return}
  if(opts.includes("ground"))for(const[c,l]of GROUNDS){const b=document.createElement("button");b.type="button";b.className="chip";
    b.setAttribute("aria-pressed",String(state.ground[state.style]===c));b.innerHTML=`<i style="background:${c}"></i>${l}`;
    b.onclick=()=>{state.ground[state.style]=c;buildOpts();persist();go(0)};o.appendChild(b)}
  if(opts.includes("skipbg")||opts.includes("pbn")){const s=document.createElement("span");s.className="sep";o.appendChild(s)}
  const tog=(key,label)=>{const b=document.createElement("button");b.type="button";b.className="chip";b.setAttribute("aria-pressed",String(state[key]));b.textContent=label;
    b.onclick=()=>{state[key]=!state[key];buildOpts();go(0)};o.appendChild(b)};
  if(opts.includes("skipbg"))tog("skipbg","Skip background");if(opts.includes("pbn"))tog("pbn","Numbers")}

function syncControls(){
  for(const b of stylesEl.children)b.setAttribute("aria-pressed",String(b.dataset.k===state.style));
  const s=META[state.style].size;$("sizeLbl").textContent=s.label;$("size").value=valToSlider(state.sizes[state.style]);$("sizeVal").textContent=s.fmt(state.sizes[state.style]);
  buildOpts();
  $("cw").value=state.cw;$("ch").value=state.ch;$("ncol").value=state.ncol;ratioSel.value=state.ratio;
  $("lockNote").textContent=state.ratio==="free"?"Width and height are independent":"Ratio locked: change either side";
  persist()}

/* ---------------- rendering ---------------- */
let timer=null;
function go(delay=120){clearTimeout(timer);if(state.bitmap)$("view").classList.add("busy");timer=setTimeout(renderNow,delay)}
// every change paints a quick small draft first, then the sharp version; thumbnails pause meanwhile
async function renderNow(){if(!state.bitmap)return;const view=$("view");view.classList.add("busy");const style=state.style;thumbR.cancel();
  try{const draft=await preview.run(style,cfgFor(style,460),state.thumbBig||state.prev);show(draft,style,true);
    const res=await preview.run(style,cfgFor(style,1000),state.prev);show(res,style)}
  catch(e){if(e&&e.cancelled)return;toast("Could not paint that: "+(e.error||e.message||String(e)));view.classList.remove("busy")}}
function toCanvas(res){const c=document.createElement("canvas");c.width=res.w;c.height=res.h;c.getContext("2d").putImageData(new ImageData(new Uint8ClampedArray(res.buf),res.w,res.h),0,0);return c}
function show(res,style,draft){const c=toCanvas(res);state.lastCanvas=c;
  c.toBlob(b=>{const old=$("out").src;$("out").src=URL.createObjectURL(b);if(old.startsWith("blob:"))setTimeout(()=>URL.revokeObjectURL(old),1000);if(!draft)$("view").classList.remove("busy")},"image/jpeg",draft?0.8:0.9);
  $("meta").innerHTML=Object.entries({...res.info}).map(([k,v])=>`<span>${k} <b>${v}</b></span>`).join("");
  const pal=res.pal;$("palSec").hidden=!pal;
  if(pal){const unit=res.counts&&res.countUnit!=="px"?res.countUnit:null;
    $("palette").innerHTML=pal.map((p,i)=>`<div class="sw"><i style="background:${hex(p)}"></i><span><b>${i+1}</b>${hex(p)}${unit?`<em>${res.counts[i]} ${unit}</em>`:""}</span></div>`).join("")}}

// thumbnails of every style from the current photo, one at a time in their own worker
let thumbGen=0;
const idle=()=>new Promise(res=>{const chk=()=>preview.pending||$("view").classList.contains("busy")?setTimeout(chk,200):res();chk()});
async function thumbs(){const gen=++thumbGen;for(let j=0;j<STYLES.length;j++){const k=STYLES[j][0];await idle();if(gen!==thumbGen)return;if(crashed.has(k))continue;
  try{const cfg={...cfgFor(k,150),cw:100,ch:100,size:k==="blocks"?2.5:Math.min(10,META[k].size.def+2),pbn:false,subjectOnly:false};
    const res=await thumbR.run(k,cfg,state.thumb);if(gen!==thumbGen)return;const c=toCanvas(res);
    const tc=stylesEl.querySelector(`[data-k="${k}"] canvas`).getContext("2d");tc.drawImage(c,0,0,168,168)}catch(e){if(e&&e.cancelled)j--}}}

/* ---------------- inputs ---------------- */
$("size").addEventListener("input",()=>{state.sizes[state.style]=sliderToVal();$("sizeVal").textContent=META[state.style].size.fmt(state.sizes[state.style]);persist();go(150)});
$("cw").addEventListener("change",()=>{state.cw=Math.max(10,+$("cw").value||100);applyRatio("cw");syncControls();go(0)});
$("ch").addEventListener("change",()=>{state.ch=Math.max(10,+$("ch").value||120);applyRatio("ch");syncControls();go(0)});
$("ncol").addEventListener("change",()=>{state.ncol=Math.max(3,Math.min(40,+$("ncol").value||24));syncControls();go(0)});
ratioSel.addEventListener("change",()=>{state.ratio=ratioSel.value;applyRatio("cw");syncControls();go(0)});

async function loadBlob(blob,name){try{const full=await createImageBitmap(blob);const bm=await shrink(full,2400);if(bm!==full)full.close();setPhoto(bm,URL.createObjectURL(blob),name)}
  catch(e){toast("That file could not be read as an image. Try a JPG or PNG.")}}
// phone photos can be 12-50 megapixels; keep only small copies so the app never runs out of memory
async function shrink(bm,max){const s=Math.min(1,max/Math.max(bm.width,bm.height));if(s>=1)return bm;
  return createImageBitmap(bm,{resizeWidth:Math.max(1,Math.round(bm.width*s)),resizeHeight:Math.max(1,Math.round(bm.height*s)),resizeQuality:"high"})}
async function setPhoto(bm,url,name){for(const k of["prev","thumbBig","thumb","bitmap"]){const o=state[k];if(o&&o!==bm&&o.close)try{o.close()}catch(e){}}
  state.prev=await shrink(bm,1200);state.thumbBig=await shrink(bm,560);state.thumb=await shrink(bm,300);if(state.origURL&&state.origURL.startsWith("blob:"))URL.revokeObjectURL(state.origURL);
  state.bitmap=bm;state.photoW=bm.width;state.photoH=bm.height;state.origURL=url;$("orig").src=url;
  state.srcName=(name||"painting").replace(/\.[^.]+$/,"");$("srcName").textContent=name||"Your photo";
  if(state.ratio!=="free"){const land=bm.width>bm.height;if(state.ratio!=="photo"&&(state.cw>state.ch)!==land&&state.cw!==state.ch){[state.cw,state.ch]=[state.ch,state.cw]}applyRatio("cw")}
  syncControls();go(0);setTimeout(thumbs,400)}
$("file").onchange=e=>{const f=e.target.files[0];if(f)loadBlob(f,f.name);e.target.value=""};
document.addEventListener("dragover",e=>e.preventDefault());
document.addEventListener("drop",e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f&&f.type.startsWith("image/"))loadBlob(f,f.name)});
document.addEventListener("paste",e=>{const it=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith("image/"));if(it){const f=it.getAsFile();loadBlob(f,"Pasted photo")}});
window.loadSharedPhoto=async(url,name)=>{const b=await (await fetch(url)).blob();loadBlob(b,name||"Shared photo")};

// hold the painting to see the original photo
const view=$("view");
const showOrig=on=>{$("orig").hidden=!on;$("out").style.visibility=on?"hidden":"visible";$("hint").textContent=on?"Original photo":"Hold to compare"};
view.addEventListener("pointerdown",e=>{if(e.button===0||e.pointerType!=="mouse")showOrig(true)});
for(const ev of["pointerup","pointercancel","pointerleave"])view.addEventListener(ev,()=>showOrig(false));
view.addEventListener("contextmenu",e=>e.preventDefault());

// save: full-resolution render; the Android app writes to Pictures/Drawing Aide, browsers download
const app=window.Android;
$("save").onclick=async()=>{if(!state.bitmap)return;toast("Painting full size…");const style=state.style;
  try{const res=await saver.run(style,cfgFor(style,2400),state.bitmap);const c=toCanvas(res);const name=(state.srcName+"-"+style).replace(/[^\w.-]+/g,"_");
    const url=c.toDataURL("image/jpeg",0.92);
    if(app&&app.saveImage){app.saveImage(url,name);return}
    const a=document.createElement("a");a.href=url;a.download=name+".jpg";document.body.appendChild(a);a.click();a.remove();toast("Saved "+name+".jpg")}
  catch(e){if(!(e&&e.cancelled))toast("Could not save: "+(e.error||e.message||String(e)))}};
if(app){$("upd").hidden=false;$("upd").onclick=()=>app.checkForUpdate();try{$("appver").textContent="v"+app.version()}catch(e){}}

syncControls();
(async()=>{const b=await (await fetch(SAMPLE)).blob();const bm=await createImageBitmap(b);await setPhoto(bm,SAMPLE,"Sample: NASA portrait (public domain)");state.srcName="sample"})();
if(crashed.size){const names=[...crashed].map(k=>META[k]?META[k].name:k).join(", ");persist();
  setTimeout(()=>toast(`The app closed while painting ${names}, so it reopened on Block impasto.`),600)}
</script>
</html>
